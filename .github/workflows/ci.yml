name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-build:
    name: Client (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  server-syntax:
    name: Server (syntax + boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # 모든 .js 파일 문법 체크
      - name: Node syntax check
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node -c
      # require chain 무결성 — app/server 로드만 시도 (DB 연결 전까지)
      - name: Module load check
        env:
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret-replace-in-production
        run: node -e "require('./src/app')"
