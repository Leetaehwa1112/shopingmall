name: Fly Deploy

# server/ 디렉토리에 변경이 있을 때만 자동 배포 (client만 바뀌면 스킵).
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/fly-deploy.yml'
  # 수동 트리거도 가능 (Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group  # 동시에 두 배포 막기
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app pokevault-api
        working-directory: ./server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
